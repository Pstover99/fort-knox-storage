<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff records — Fort Knox Self-Storage</title>
<style>*{box-sizing:border-box}
html{scroll-behavior:smooth}
:target{animation:flash 1.2s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--rollup,#e08a1e)}100%{box-shadow:0 0 0 3px transparent}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}:target{animation:none;outline:3px solid var(--rollup,#e08a1e)}}
body{margin:0;min-height:100vh;background:var(--concrete,#eceff1);color:#1a2026;
font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:root{--wall:#1f2a33;--panel:#f4f6f7;--ink:#1a2026;--ink-soft:#5b6b78;
--rollup:#e08a1e;--rollup-dark:#c2740f;--line:#d3dadf;--steel:#8a9aa6;--concrete:#eceff1}
header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;
gap:.5rem 1.5rem;background:var(--wall);padding:1rem 1.25rem;border-bottom:4px solid var(--rollup)}
.brand{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:1.3rem;
letter-spacing:.02em;color:#fff;text-decoration:none}
.brand span{display:inline-grid;place-items:center;width:2rem;height:2rem;border-radius:5px;
background:var(--rollup);color:var(--wall);font-weight:900}
nav a{color:#c7d2da;margin-left:1.1rem;text-decoration:none;font-weight:600;font-size:.95rem}
nav a:hover,nav a:focus-visible{color:var(--rollup)}
main{max-width:54rem;margin:0 auto;padding:1.75rem 1.25rem 3rem}
h1{font-size:1.9rem;font-weight:800;line-height:1.15;margin:0 0 .5rem}
h2{font-size:1.2rem;margin:1.5rem 0 .5rem}
.sub{color:var(--ink-soft);margin:0 0 1.5rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:1.5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(12rem,1fr));gap:1rem;margin:1.5rem 0}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:1.1rem}
.card b{display:block;font-size:1.4rem}
label{display:block;font-weight:600;margin:1rem 0 .3rem}
input{width:100%;padding:.6rem .7rem;font:inherit;border:1px solid var(--steel);border-radius:5px;background:#fff}
button{margin-top:1.3rem;padding:.7rem 1.5rem;font:inherit;font-weight:700;color:var(--wall);
background:var(--rollup);border:0;border-radius:5px;cursor:pointer}
button:hover{background:var(--rollup-dark)}
:is(a,input,button):focus-visible{outline:3px solid var(--rollup);outline-offset:2px}
.error{color:#b3261e;font-weight:600;margin:1rem 0 0}
.muted{color:var(--ink-soft)}.small{font-size:.9rem}
.banner{background:#fff3d6;border:1px solid var(--rollup);padding:.75rem 1rem;border-radius:6px;margin-bottom:1rem}
.stop{background:#fbe0d6;border:1px solid #a5341a;color:#7a2814}
.out{display:block;margin-top:1rem;padding:1rem;font-size:1.1rem;
font-family:ui-monospace,Menlo,Consolas,monospace;background:#fff3d6;
border:1px dashed var(--rollup-dark);border-radius:6px;overflow-wrap:anywhere}
.locked{border-left:5px solid var(--rollup)}
.login{display:grid;grid-template-columns:minmax(0,23rem) auto;gap:2.5rem;align-items:start}
.tag{display:inline-block;padding:.1rem .5rem;border-radius:999px;font-size:.8rem;font-weight:600}
.paid{background:#d9f0e0;color:#12683a}.due{background:#fbe0d6;color:#a5341a}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.55rem .5rem;border-bottom:1px solid var(--line)}
th{color:var(--ink-soft);font-size:.9rem}
footer{max-width:54rem;margin:0 auto;padding:1rem 1.25rem 3rem;color:var(--ink-soft);font-size:.85rem}
[hidden]{display:none!important}
@media (max-width:42rem){.login{grid-template-columns:1fr}}</style>
</head>
<body>
<header><a class="brand" href="../"><span>FK</span>Fort Knox Self-Storage</a><nav><a href="../">Home</a><a href="../pricing/">Units &amp; pricing</a><a href="../unit-search/">Find a unit</a><a href="../tenant-login/">Tenant login</a></nav></header>
<style>#qout{display:block;white-space:pre-wrap;word-break:break-all;background:#1f2a33;color:#c7d2da;padding:.7rem .8rem;border-radius:6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem;margin:.5rem 0 1rem}.ok{color:#12683a;font-weight:600;margin-bottom:.5rem}.err{color:#b3261e;font-weight:600}</style><main>
  <h1>Staff records portal</h1>
  <p class="sub">Legacy internal tool. Look up your own staff record by signing in.</p>

      <input id="username" autocomplete="off" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="off" required>
      <button type="submit">Look up record</button>
    </form>
    <p class="muted small" style="margin-top:1rem">Query sent to the database:</p>
    <code id="qout">(submit to see the query)</code>
    <div id="qres"></div>
  </section>
  <!-- built in 2014, never patched. input goes straight into the query string. -->
</main>

</html>
